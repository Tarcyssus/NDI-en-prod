# config/packages/nelmio_cors.yaml
nelmio_cors:
  defaults:
    origin_regex: true
    allow_origin: []
    allow_methods: []
    allow_headers: []
    expose_headers: []
    max_age: 0

  paths:
    '^/':
      # ✅ Spécifier explicitement le domaine frontend
      allow_origin:
        - 'https://ndi-en-prod-frontend.labs.iut-larochelle.fr'
        - 'http://localhost:5173'  # Pour le dev local (Vite)
        - 'http://localhost:3000'  # Pour le dev local (proxy/CRA)
      allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
      allow_headers: ['Content-Type', 'Authorization', 'X-Requested-With', 'Accept']
      expose_headers: ['Link', 'X-Total-Count']
      max_age: 3600
      allow_credentials: true
