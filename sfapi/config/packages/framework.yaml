# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
  secret: '%env(APP_SECRET)%'
  annotations: false
  http_method_override: false
  handle_all_throwables: true

  # ✅ Configuration des proxies de confiance
  trusted_proxies: '%env(TRUSTED_PROXIES)%'
  trusted_headers:
    - 'x-forwarded-for'
    - 'x-forwarded-proto'
    - 'x-forwarded-port'
    - 'x-forwarded-host'

  # Enables session support
  session:
    handler_id: null
    cookie_secure: true  # ✅ Forcé à true (car vous êtes en HTTPS via ingress)
    cookie_samesite: lax
    cookie_httponly: true

  php_errors:
    log: true

when@test:
  framework:
    test: true
    session:
      storage_factory_id: session.storage.factory.mock_file

when@dev:
  framework:
    session:
      cookie_secure: false  # ✅ HTTP en dev local
