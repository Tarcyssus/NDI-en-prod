server {
    listen 80;
    server_name _;

    root /mnt/sfapi/public;
    index index.php;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Trust proxy
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    # Rewrite rules
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP-FPM handler
    location ~ ^/index\.php(/|$) {
        fastcgi_pass ${PHP_FPM_HOST}:${PHP_FPM_PORT};
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /mnt/sfapi/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /mnt/sfapi/public;

        # HTTPS forcing
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;

        # Pass CORS headers to PHP
        fastcgi_param HTTP_ACCESS_CONTROL_REQUEST_METHOD $http_access_control_request_method;
        fastcgi_param HTTP_ACCESS_CONTROL_REQUEST_HEADERS $http_access_control_request_headers;
    }

    # Deny other PHP files
    location ~ \.php$ {
        return 404;
    }
}
